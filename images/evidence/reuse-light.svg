<svg xmlns="http://www.w3.org/2000/svg" width="600" height="392" viewBox="0 0 600 392" role="img" aria-labelledby="t d">
  <title id="t">Reusing a result instead of redoing it: about 750 times faster, zero AI tokens</title>
  <desc id="d">Redoing the job took 2.79 seconds and 2,426 AI tokens. Reusing the finished result took 3.7 milliseconds to verify offline and used no AI tokens.</desc>
  <rect x="0.5" y="0.5" width="599" height="391" rx="12" fill="#FCFCFB" stroke="#E3E2DE"/>
  <g font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="24" y="40" font-size="15" font-weight="400" fill="#5B5E64" text-anchor="start">One finished agent job, reused with no account</text>
    <text x="24" y="80" font-size="14" font-weight="600" fill="#5B5E64" text-anchor="start">TIME</text>
    <text x="24" y="110" font-size="17" font-weight="400" fill="#15171B" text-anchor="start">Redo the job</text>
    <text x="576" y="110" font-size="17" font-weight="600" fill="#15171B" text-anchor="end">2.79 s</text>
    <rect x="24" y="120" width="552" height="20" rx="4" fill="#E9E8E4"/>
    <path d="M24 120H572Q576 120 576 124V136Q576 140 572 140H24Z" fill="#8A8F98"/>
    <text x="24" y="168" font-size="17" font-weight="400" fill="#15171B" text-anchor="start">Reuse the result</text>
    <text x="576" y="168" font-size="17" font-weight="600" fill="#15171B" text-anchor="end">3.7 ms</text>
    <rect x="24" y="178" width="552" height="20" rx="4" fill="#E9E8E4"/>
    <path d="M24 178H25.5Q27 178 27 179.5V196.5Q27 198 25.5 198H24Z" fill="#2F5097"/>
    <line x1="24" y1="218" x2="576" y2="218" stroke="#E3E2DE"/>
    <text x="24" y="250" font-size="14" font-weight="600" fill="#5B5E64" text-anchor="start">AI TOKENS</text>
    <text x="24" y="280" font-size="17" font-weight="400" fill="#15171B" text-anchor="start">Redo the job</text>
    <text x="576" y="280" font-size="17" font-weight="600" fill="#15171B" text-anchor="end">2,426</text>
    <rect x="24" y="290" width="552" height="20" rx="4" fill="#E9E8E4"/>
    <path d="M24 290H572Q576 290 576 294V306Q576 310 572 310H24Z" fill="#8A8F98"/>
    <text x="24" y="338" font-size="17" font-weight="400" fill="#15171B" text-anchor="start">Reuse the result</text>
    <text x="576" y="338" font-size="17" font-weight="600" fill="#15171B" text-anchor="end">0</text>
    <rect x="24" y="348" width="552" height="20" rx="4" fill="#E9E8E4"/>

  </g>
</svg>
