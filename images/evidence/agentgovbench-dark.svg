<svg xmlns="http://www.w3.org/2000/svg" width="600" height="272" viewBox="0 0 600 272" role="img" aria-labelledby="t d">
  <title id="t">AgentGovBench: Proofable passed 48 of 48 scenarios</title>
  <desc id="d">On the 48 open AgentGovBench governance scenarios, Proofable passed 48. A gate that allows everything passed 28, and no governance passed 13.</desc>
  <rect x="0.5" y="0.5" width="599" height="271" rx="12" fill="#141416" stroke="#2A2A2E"/>
  <g font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="24" y="40" font-size="15" font-weight="400" fill="#B9BABD" text-anchor="start">48 open scenarios in eight areas, run October 17, 2026</text>
    <text x="24" y="84" font-size="17" font-weight="400" fill="#F5F5F5" text-anchor="start">Proofable</text>
    <text x="576" y="84" font-size="17" font-weight="600" fill="#F5F5F5" text-anchor="end">48 of 48</text>
    <rect x="24" y="94" width="552" height="20" rx="4" fill="#26262A"/>
    <path d="M24 94H572Q576 94 576 98V110Q576 114 572 114H24Z" fill="#98C0EF"/>
    <text x="24" y="150" font-size="17" font-weight="400" fill="#F5F5F5" text-anchor="start">A gate that allows everything</text>
    <text x="576" y="150" font-size="17" font-weight="600" fill="#F5F5F5" text-anchor="end">28 of 48</text>
    <rect x="24" y="160" width="552" height="20" rx="4" fill="#26262A"/>
    <path d="M24 160H342Q346 160 346 164V176Q346 180 342 180H24Z" fill="#6B6F77"/>
    <text x="24" y="216" font-size="17" font-weight="400" fill="#F5F5F5" text-anchor="start">No governance</text>
    <text x="576" y="216" font-size="17" font-weight="600" fill="#F5F5F5" text-anchor="end">13 of 48</text>
    <rect x="24" y="226" width="552" height="20" rx="4" fill="#26262A"/>
    <path d="M24 226H169.5Q173.5 226 173.5 230V242Q173.5 246 169.5 246H24Z" fill="#6B6F77"/>
  </g>
</svg>
