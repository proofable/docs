<svg xmlns="http://www.w3.org/2000/svg" width="600" height="338" viewBox="0 0 600 338" role="img" aria-labelledby="t d">
  <title id="t">AgentGovBench: Proofable passed 48 of 48 scenarios</title>
  <desc id="d">On the current 48-scenario AgentGovBench library, Proofable passed 48, the maintainers' ACP gateway 46, a gate that allows everything 20, and no governance 5.</desc>
  <rect x="0.5" y="0.5" width="599" height="337" rx="12" fill="#FCFCFB" stroke="#E3E2DE"/>
  <g font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="24" y="40" font-size="15" font-weight="400" fill="#5B5E64" text-anchor="start">Current library, 48 scenarios in eight areas, run October 20, 2026</text>
    <text x="24" y="84" font-size="17" font-weight="400" fill="#15171B" text-anchor="start">Proofable</text>
    <text x="576" y="84" font-size="17" font-weight="600" fill="#15171B" text-anchor="end">48 of 48</text>
    <rect x="24" y="94" width="552" height="20" rx="4" fill="#E9E8E4"/>
    <path d="M24 94H572Q576 94 576 98V110Q576 114 572 114H24Z" fill="#2F5097"/>
    <text x="24" y="150" font-size="17" font-weight="400" fill="#15171B" text-anchor="start">ACP, the benchmark maintainers' gateway</text>
    <text x="576" y="150" font-size="17" font-weight="600" fill="#15171B" text-anchor="end">46 of 48</text>
    <rect x="24" y="160" width="552" height="20" rx="4" fill="#E9E8E4"/>
    <path d="M24 160H549Q553 160 553 164V176Q553 180 549 180H24Z" fill="#8A8F98"/>
    <text x="24" y="216" font-size="17" font-weight="400" fill="#15171B" text-anchor="start">A gate that allows everything</text>
    <text x="576" y="216" font-size="17" font-weight="600" fill="#15171B" text-anchor="end">20 of 48</text>
    <rect x="24" y="226" width="552" height="20" rx="4" fill="#E9E8E4"/>
    <path d="M24 226H250Q254 226 254 230V242Q254 246 250 246H24Z" fill="#8A8F98"/>
    <text x="24" y="282" font-size="17" font-weight="400" fill="#15171B" text-anchor="start">No governance</text>
    <text x="576" y="282" font-size="17" font-weight="600" fill="#15171B" text-anchor="end">5 of 48</text>
    <rect x="24" y="292" width="552" height="20" rx="4" fill="#E9E8E4"/>
    <path d="M24 292H77.5Q81.5 292 81.5 296V308Q81.5 312 77.5 312H24Z" fill="#8A8F98"/>
  </g>
</svg>
